<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assemblee N-gram Explorer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">French parliamentary speeches</p>
        <h1>Assemblee N-gram Explorer</h1>
      </div>
      <div class="summary-strip" id="summaryStrip"></div>
    </header>

    <main class="app-shell">
      <section class="chamber-panel" aria-label="Politician chamber map">
        <div class="toolbar">
          <label class="field search-field">
            <span>Search</span>
            <input id="searchInput" type="search" autocomplete="off" placeholder="Name" />
          </label>
          <label class="field">
            <span>Party</span>
            <select id="partyFilter"></select>
          </label>
          <label class="field theme-field">
            <span>Theme</span>
            <div class="theme-combobox">
              <input id="themeSearch" type="search" autocomplete="off" placeholder="All issues" />
              <div class="theme-menu" id="themeMenu" hidden></div>
            </div>
          </label>
          <label class="toggle-field">
            <input id="showUnlabeled" type="checkbox" />
            <span>Unlabeled</span>
          </label>
        </div>

        <div class="search-results" id="searchResults"></div>
        <div class="theme-context" id="themeContext" hidden></div>

        <div class="chamber-wrap">
          <svg id="chamberSvg" viewBox="0 0 1000 640" role="img" aria-label="Semicircle party layout"></svg>
          <div class="legend" id="partyLegend"></div>
        </div>
      </section>

      <aside class="analysis-panel">
        <div class="tabs" role="tablist" aria-label="Analysis sections">
          <button class="tab" data-tab="theme" type="button" id="themeTab" hidden>Theme</button>
          <button class="tab is-active" data-tab="politician" type="button">Politician</button>
          <button class="tab" data-tab="party" type="button">Party</button>
          <button class="tab" data-tab="markers" type="button">Markers</button>
          <button class="tab" data-tab="corpus" type="button">Corpus</button>
        </div>
        <div id="analysisContent"></div>
      </aside>
    </main>

    <dialog id="politicianDialog" class="detail-dialog">
      <div class="dialog-bar">
        <div id="dialogTitle"></div>
        <button class="close-button" id="closeDialog" type="button" aria-label="Close">x</button>
      </div>
      <div id="dialogContent"></div>
    </dialog>

    <script src="data/dashboard-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
