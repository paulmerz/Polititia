<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>L'hémicycle des idées et des mots</title>
    <link rel="stylesheet" href="styles.css?v=merged-1" />
  </head>
  <body data-mode="citizen">
    <header class="topbar">
      <div class="brand-block">
        <p class="eyebrow" id="appEyebrow">La parole des députés</p>
        <h1 id="appTitle">L'hémicycle des idées et des mots</h1>
      </div>
      <div class="topbar-side">
        <div class="mode-toggle" role="group" aria-label="Mode d'affichage">
          <button class="mode-button is-active" type="button" data-audience-mode="citizen">Citoyen</button>
          <button class="mode-button" type="button" data-audience-mode="scientific">Scientifique</button>
        </div>
        <div class="summary-strip" id="summaryStrip"></div>
      </div>
    </header>

    <main class="app-shell">
      <section class="chamber-panel" id="chamberPanel" aria-label="Carte de l'hémicycle">
        <div class="toolbar">
          <label class="field search-field">
            <span id="searchLabel">Rechercher</span>
            <input id="searchInput" type="search" autocomplete="off" placeholder="Nom" />
          </label>
          <label class="field">
            <span id="partyFilterLabel">Groupe</span>
            <select id="partyFilter"></select>
          </label>
          <label class="field theme-field">
            <span id="themeFieldLabel">Enjeu</span>
            <div class="theme-combobox">
              <input id="themeSearch" type="search" autocomplete="off" placeholder="Tous les enjeux" />
              <div class="theme-menu" id="themeMenu" hidden></div>
            </div>
          </label>
          <label class="toggle-field">
            <input id="showUnlabeled" type="checkbox" />
            <span id="unlabeledLabel">Non rattachés</span>
          </label>
          <div class="field">
            <span id="seatSizeLabel">Taille des sièges</span>
            <div class="segmented" id="seatSizeGroup" role="group" aria-label="Taille des sièges">
              <button type="button" data-seat-metric="speeches" aria-pressed="false">Interventions</button>
              <button type="button" data-seat-metric="tokens" class="is-active" aria-pressed="true">Mots</button>
            </div>
          </div>
        </div>

        <div class="search-results" id="searchResults"></div>
        <div class="theme-context" id="themeContext" hidden></div>

        <div class="chamber-wrap">
          <p class="seat-scale-note" id="seatScaleNote"></p>
          <svg id="chamberSvg" viewBox="0 0 1000 640" role="img" aria-label="Répartition des groupes en hémicycle"></svg>
          <div class="legend" id="partyLegend"></div>
        </div>
      </section>

      <aside class="analysis-panel">
        <div class="tabs" id="analysisTabs" role="tablist" aria-label="Sections d'analyse">
          <button class="tab" data-tab="theme" type="button" id="themeTab" hidden>Enjeu</button>
          <button class="tab is-active" data-tab="politician" type="button">Député</button>
          <button class="tab" data-tab="party" type="button">Groupe</button>
          <button class="tab" data-tab="markers" type="button">Style</button>
          <button class="tab" data-tab="corpus" type="button">Assemblée</button>
          <button class="tab" data-tab="themes" type="button">Sujets</button>
        </div>
        <div id="analysisContent"></div>
      </aside>
    </main>

    <dialog id="politicianDialog" class="detail-dialog">
      <div class="dialog-bar">
        <div id="dialogTitle"></div>
        <button class="close-button" id="closeDialog" type="button" aria-label="Fermer">x</button>
      </div>
      <div id="dialogContent"></div>
    </dialog>

    <script src="data/dashboard-data.js"></script>
    <script src="app.js?v=merged-1"></script>
  </body>
</html>
